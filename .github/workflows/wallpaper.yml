
name: wallpaper

on:
  # 기존 자동 실행은 새 방식이 정상 작동할 때까지 유지
  schedule:
    - cron: '10 19 * * *'
    - cron: '10 7 * * *'

  # 아이폰 단축어에서 이미지 생성 요청
  repository_dispatch:
    types: [wallpaper-update]

  # GitHub에서 수동 실행
  workflow_dispatch:
    inputs:
      slot:
        description: "생성할 시간대"
        type: choice
        options: [auto, day, night]
        default: auto
      latitude:
        description: "위도 (선택)"
        type: string
        default: ""
      longitude:
        description: "경도 (선택)"
        type: string
        default: ""
      theme:
        description: "테스트할 장면 테마"
        type: choice
        options: [auto, nature, city, cyberpunk, cozy_room, toy_village, spirit_realm, cosmic, fantasy, underwater, steampunk, desert, snow_globe, night_market, seaside_harbor, magic_library, retro_arcade, countryside_station, sky_islands, storybook_village, onsen_town, floating_city, botanical_dome, aquarium_tunnel, mountain_cablecar, festival, canal_city, lighthouse_coast, enchanted_greenhouse, mushroom_realm, clockwork_station, space_colony, arcane_academy, coastal_cliffs, waterfall_grotto, desert_caravan, medieval_port, winter_village, cloud_cafe, mechanical_garden, dream_train, abandoned_ruins, rainy_alley, harbor_festival, miniature_world]
        default: auto

concurrency:
  group: wallpaper
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Generate wallpaper
        env:
          PYTHONPATH: src
          SLOT: ${{ github.event.client_payload.slot || inputs.slot || 'auto' }}
          THEME: ${{ inputs.theme || 'auto' }}
          WEATHER_LATITUDE: ${{ github.event.client_payload.latitude || inputs.latitude || '37.5665' }}
          WEATHER_LONGITUDE: ${{ github.event.client_payload.longitude || inputs.longitude || '126.9780' }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WALLPAPER_MODEL: ${{ vars.WALLPAPER_MODEL }}
          LATEST_JSON_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/latest.json
        run: python -m wallpaper.main --slot "$SLOT" --theme "$THEME" --out site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      # Keep experiment output downloadable without publishing it to the live wallpaper URL.
      - uses: actions/upload-artifact@v4
        with:
          name: pixel-art-preview
          path: site
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
