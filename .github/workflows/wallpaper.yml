
name: wallpaper

on:
  # 기존 자동 실행은 새 방식이 정상 작동할 때까지 유지
  schedule:
    - cron: '10 19 * * *'
    - cron: '10 7 * * *'

  # 아이폰 단축어에서 이미지 생성 요청
  repository_dispatch:
    types: [wallpaper-update]

  # GitHub에서 수동 실행
  workflow_dispatch:
    inputs:
      slot:
        description: "생성할 시간대"
        type: choice
        options: [auto, day, night]
        default: auto
      latitude:
        description: "위도 (선택)"
        type: string
        default: ""
      longitude:
        description: "경도 (선택)"
        type: string
        default: ""

concurrency:
  group: wallpaper
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Generate wallpaper
        env:
          PYTHONPATH: src
          SLOT: ${{ github.event.client_payload.slot || inputs.slot || 'auto' }}
          WEATHER_LATITUDE: ${{ github.event.client_payload.latitude || inputs.latitude || '37.5665' }}
          WEATHER_LONGITUDE: ${{ github.event.client_payload.longitude || inputs.longitude || '126.9780' }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WALLPAPER_MODEL: ${{ vars.WALLPAPER_MODEL }}
          LATEST_JSON_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/latest.json
        run: python -m wallpaper.main --slot "$SLOT" --out site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
